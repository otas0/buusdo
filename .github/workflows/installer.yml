name: installer

# Build unsigned Windows Inno setup.exe for GitHub Releases.
# Prefer workflow_dispatch (one shot). Do not agent-poll; download the artifact when green.
# Optional: attach Setup + SHA256SUMS to the draft preview release (never publishes, never v1.*).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why build installer (preview packaging)"
        required: false
        default: "unsigned-inno"
      attach_draft:
        description: "Attach Setup+SHA256SUMS to draft v0.1.0-installer-preview (unpublished)"
        type: boolean
        required: false
        default: true
      explorer_wordmark_ok:
        description: "Human confirmed Explorer wordmark on Setup + buusdo.exe (required for Authenticode)"
        type: boolean
        required: false
        default: false
      sign_authenticode:
        description: "Sign throwaway copies with repo secrets (never default; needs wordmark-OK + secrets)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  windows-inno:
    runs-on: windows-latest
    steps:
      - name: Notes
        shell: bash
        run: |
          {
            echo "## Unsigned Inno installer"
            echo "Authenticode prep started — still no signed ship until Explorer wordmark smoke."
            echo "v1.0.0 only after manual smoke. Keep draft unpublished."
            echo "0.1.1 prep started (fixes-only); do not tag until launch/scan Issues."
            echo "Phase 3 stays on phase3/dwm-hdr (default branch is main)."
            echo "Authenticode CI: sign_authenticode=${{ inputs.sign_authenticode }} explorer_wordmark_ok=${{ inputs.explorer_wordmark_ok }} (default both false)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticode gate (fail closed)
        if: ${{ inputs.sign_authenticode }}
        shell: bash
        env:
          WORDMARK_OK: ${{ inputs.explorer_wordmark_ok }}
          HAS_PFX: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          HAS_PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [[ "${WORDMARK_OK}" != "true" ]]; then
            echo "::error::Refusing Authenticode: set explorer_wordmark_ok=true after manual Explorer smoke."
            exit 1
          fi
          if [[ "${HAS_PFX}" != "true" || "${HAS_PFX_PASS}" != "true" ]]; then
            echo "::error::Refusing Authenticode: missing WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD secrets."
            exit 1
          fi
          echo "Authenticode gate passed (wordmark-OK + secrets present)."
          echo "NOTE: this job still builds unsigned Setup by default; signing replaces draft only when a later step is added and explicitly reviewed."
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Cache payload exe + workdir. .pyi-work alone does not shorten builds: PyInstaller
      # invalidates Analysis on fresh-checkout mtimes and uv-synced .venv (see gate log).
      # Exact-key hit only → reuse exe (no restore-keys) so a partial restore never ships a stale binary.
      - name: Cache PyInstaller payload
        id: pyi-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/.pyi-work
            dist/payload/buusdo.exe
          key: pyi-${{ runner.os }}-${{ hashFiles('packaging/pyinstaller_buusdo.spec', 'buusdo/assets/logo.ico', 'buusdo/assets/**', 'uv.lock', 'buusdo/**/*.py') }}
      - name: Install Python deps
        run: uv sync --extra devui
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Gates
        shell: bash
        run: |
          uv run python scripts/smoke_github_release_gate.py
          uv run python scripts/mvp_self_test.py
          uv run python scripts/check_logo_assets.py
          uv run python scripts/check_release_visual_checklist.py
      - name: Wheel + Inno package
        shell: bash
        env:
          BUUSDO_PAYLOAD_BACKEND: pyinstaller
          BUUSDO_REUSE_CACHED_PAYLOAD: ${{ steps.pyi-cache.outputs.cache-hit }}
        run: |
          bash scripts/package_mvp.sh
          bash scripts/package_windows_inno.sh
      - name: List dist + PE icon verify
        shell: bash
        run: |
          ls -la dist || true
          ls -la dist/payload || true
          ls -la buusdo/assets/logo.ico
          uv run python scripts/verify_pe_icon.py --search-dist
          {
            echo "## Icon smoke"
            echo "- PE: \`scripts/verify_pe_icon.py\` (RT_GROUP_ICON on Setup + buusdo.exe)."
            echo "- Manual Explorer: wordmark on Setup + buusdo.exe before Authenticode."
            echo "- Keep draft unpublished; no v1.*; hold 0.1.1 for launch/scan Issues."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: buusdo-windows-installer
          path: |
            dist/buusdo-setup-*.exe
            dist/SHA256SUMS
            dist/INSTALL.txt
            dist/*.whl
            dist/payload/buusdo.exe
          if-no-files-found: warn
          retention-days: 14
      - name: Install + launch smoke
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path dist -Filter "buusdo-setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $setup) {
            powershell -ExecutionPolicy Bypass -File scripts/smoke_windows_install.ps1 -SetupExe $setup.FullName
          } else {
            Write-Host "WARN no setup.exe - structural smoke only"
            powershell -ExecutionPolicy Bypass -File scripts/smoke_windows_install.ps1 -SkipLaunch
          }
      - name: Attach Setup + SHA256SUMS to draft (unpublished)
        if: ${{ success() && inputs.attach_draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/attach_installer_to_draft.sh
          bash scripts/attach_installer_to_draft.sh v0.1.0-installer-preview
      - name: Re-verify PE icon on attached draft Setup
        if: ${{ success() && inputs.attach_draft }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/draft-verify
          gh release download v0.1.0-installer-preview -D dist/draft-verify -p 'buusdo-setup-*.exe'
          SETUP="$(ls dist/draft-verify/buusdo-setup-*.exe | head -1)"
          uv run python scripts/verify_pe_icon.py "${SETUP}"
          {
            echo "## Draft PE re-verify"
            echo "- Downloaded attached draft Setup and ran \`verify_pe_icon.py\` (pass)."
            echo "- Explorer wordmark remains a **manual** gate before Authenticode."
          } >> "$GITHUB_STEP_SUMMARY"
