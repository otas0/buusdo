name: installer

# Build unsigned Windows Inno setup.exe for GitHub Releases.
# Prefer workflow_dispatch (one shot). Do not agent-poll; download the artifact when green.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why build installer (preview packaging)"
        required: false
        default: "unsigned-inno"

jobs:
  windows-inno:
    runs-on: windows-latest
    steps:
      - name: Notes
        shell: bash
        run: |
          {
            echo "## Unsigned Inno installer"
            echo "No Authenticode. SmartScreen may warn."
            echo "v1.0.0 only after manual smoke of the artifact."
            echo "0.1.1 remains fixes-only; this job is the installer track."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: uv sync --extra devui
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Gates
        shell: bash
        run: |
          uv run python scripts/smoke_github_release_gate.py
          uv run python scripts/mvp_self_test.py
          uv run python scripts/check_logo_assets.py
          uv run python scripts/check_release_visual_checklist.py
      - name: Wheel + Inno package
        shell: bash
        run: |
          bash scripts/package_mvp.sh
          bash scripts/package_windows_inno.sh
      - name: List dist + PE icon verify
        shell: bash
        run: |
          ls -la dist || true
          ls -la buusdo/assets/logo.ico
          uv run python scripts/verify_pe_icon.py --search-dist
          {
            echo "## Icon smoke"
            echo "- PE resource check ran via \`scripts/verify_pe_icon.py\` (RT_GROUP_ICON)."
            echo "- Manual: Explorer must show wordmark on Setup + \`buusdo.exe\`."
            echo "- Authenticode deferred. Do **not** tag \`v1.*\` until smoke passes."
            echo "- Hold \`0.1.1\` until real \`launch\`/\`scan\` Issues are filed and fixed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install + launch smoke
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path dist -Filter "buusdo-setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            powershell -ExecutionPolicy Bypass -File scripts/smoke_windows_install.ps1 -SetupExe $setup.FullName
          } else {
            Write-Host "WARN no setup.exe — structural smoke only"
            powershell -ExecutionPolicy Bypass -File scripts/smoke_windows_install.ps1 -SkipLaunch
          }
      - uses: actions/upload-artifact@v4
        with:
          name: buusdo-windows-installer
          path: |
            dist/buusdo-setup-*.exe
            dist/SHA256SUMS
            dist/INSTALL.txt
            dist/*.whl
            dist/payload/buusdo.exe
          if-no-files-found: warn
          retention-days: 14
