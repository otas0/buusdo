name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual package run (after Billing fix: one dispatch only)"
        required: false
        default: "manual"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: buusdo-windows
          - os: ubuntu-latest
            artifact: buusdo-linux
          - os: macos-latest
            artifact: buusdo-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Billing / spending-limit tip
        shell: bash
        run: |
          {
            echo "## Runner preflight"
            echo "0s empty-step fails ⇒ raise Actions spending limit."
            echo "After Billing is fixed: **one** workflow_dispatch only."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra devui
      - name: MVP self-test
        run: uv run python scripts/mvp_self_test.py
      - name: Package wheel/sdist + checksums
        shell: bash
        run: bash scripts/package_mvp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: warn
