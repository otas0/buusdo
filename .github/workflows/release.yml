name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: buusdo-windows
          - os: ubuntu-latest
            artifact: buusdo-linux
          - os: macos-latest
            artifact: buusdo-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,ui]"
      - name: Test
        run: |
          python scripts/check_no_platform_branch.py
          pytest -q
      - name: Package note
        shell: bash
        run: |
          mkdir -p dist
          echo "Run scripts/deploy.sh on a signed builder with pyside6-deploy/Nuitka." > dist/README-PACKAGING.txt
          echo "Then: ./scripts/codesign_hooks.sh <artifact>  (local secrets via scripts/codesign.env; never in CI)." >> dist/README-PACKAGING.txt
          echo "artifact=${{ matrix.artifact }}" >> dist/README-PACKAGING.txt
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            find . -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          else
            shasum -a 256 $(find . -type f ! -name 'SHA256SUMS' | sort) > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
