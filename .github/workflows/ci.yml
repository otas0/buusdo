name: ci

on:
  push:
    branches: [main, "phase3/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Platform-branch lint (C3)
        run: python scripts/check_no_platform_branch.py
      - name: Pytest
        run: pytest -q --ignore=tests/test_ui_blocked_smoke.py

  devui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps for Qt/offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libxcb-cursor0 xvfb
      - name: Install UI extras
        run: |
          python -m pip install -U pip
          pip install -e ".[devui]"
      - name: UI smoke under xvfb
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a pytest -q tests/test_ui_blocked_smoke.py

  devui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI extras
        run: |
          python -m pip install -U pip
          pip install -e ".[devui]"
      - name: Blocked-page smoke (offscreen)
        id: smoke
        run: |
          set -o pipefail
          export QT_QPA_PLATFORM=offscreen
          export QT_DEBUG_PLUGINS=1
          mkdir -p qt-diag
          python -V | tee qt-diag/python.txt
          echo "QT_DEBUG_PLUGINS=$QT_DEBUG_PLUGINS" | tee qt-diag/qt-env.txt
          python -c "import os; from PySide6.QtCore import QLibraryInfo; print('QT_QPA_PLATFORM=', os.environ.get('QT_QPA_PLATFORM')); print('PluginsPath=', QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath))" | tee qt-diag/qt-plugins.txt || true
          pytest -q tests/test_ui_blocked_smoke.py 2>&1 | tee qt-diag/devui-macos.log
      - name: Upload Qt diagnostic artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qt-diag-macos
          path: qt-diag/
          if-no-files-found: warn

  dwm-hdr-poc:
    # phase3/dwm-hdr only — skipped on main when HLSL stubs are absent
    if: hashFiles('buusdo/core/dwm_hdr_shaders/sdr_to_hdr_tonemap.hlsl') != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Offline fxc/dxc compile + sha256
        shell: bash
        run: |
          python scripts/compile_dwm_hdr_poc.py --out dist/dwm_hdr_poc
          test -f dist/dwm_hdr_poc/manifest.json
          python - <<'PY'
          import json, hashlib, pathlib, shutil, sys
          root = pathlib.Path("dist/dwm_hdr_poc")
          man = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          cso = root / "sdr_to_hdr_tonemap.cso"
          has_compiler = bool(shutil.which("dxc") or shutil.which("dxc.exe") or shutil.which("fxc") or shutil.which("fxc.exe"))
          kits = pathlib.Path(r"C:\Program Files (x86)\Windows Kits\10\bin")
          if not has_compiler and kits.is_dir():
              has_compiler = any((p / "x64" / name).is_file() for p in kits.iterdir() if p.is_dir() for name in ("dxc.exe", "fxc.exe"))
          if has_compiler:
              # Windows Kits present: require a successful compile (status=ok).
              assert man.get("status") == "ok", man
              assert cso.is_file(), "cso missing after ok compile"
              digest = hashlib.sha256(cso.read_bytes()).hexdigest()
              assert man.get("sha256") == digest, (man.get("sha256"), digest)
              print("sha256 ok", digest)
          elif man.get("status") == "skipped_no_compiler":
              print("compiler missing on runner; HLSL materialize-only accepted")
          elif man.get("status") == "ok":
              digest = hashlib.sha256(cso.read_bytes()).hexdigest()
              assert man.get("sha256") == digest
              print("sha256 ok", digest)
          else:
              print(man)
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwm-hdr-poc
          path: dist/dwm_hdr_poc/
          if-no-files-found: warn
