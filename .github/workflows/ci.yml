name: ci

# If every job fails in ~2–4s with steps=[] and annotation about spending limit /
# failed payments, fix Settings → Billing & plans first — no artifact can upload.
run-name: >-
  ci (${{ github.event_name }}) —
  0s empty-step fails ⇒ raise Actions spending limit (Billing)

on:
  push:
    branches: [main, "phase3/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run (e.g. re-upload artifacts after quota recover)"
        required: false
        default: "manual"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Billing / spending-limit tip
        run: |
          {
            echo "## Runner preflight"
            echo "If this job (or siblings) dies in **~2–4 seconds** with **no steps** and a"
            echo "spending-limit / failed-payments annotation, open"
            echo "**Settings → Billing & plans** and raise the Actions spending limit."
            echo "Until runners start, \`dwm-hdr-poc\` will not appear under Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Platform-branch lint (C3)
        run: python scripts/check_no_platform_branch.py
      - name: err.* i18n completeness (zh/en)
        run: python scripts/check_err_i18n.py
      - name: Pytest
        run: pytest -q --ignore=tests/test_ui_blocked_smoke.py

  devui:
    runs-on: ubuntu-latest
    steps:
      - name: Billing / spending-limit tip
        run: |
          {
            echo "## Runner preflight"
            echo "0s empty-step failures ⇒ raise Actions spending limit (Billing & plans)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps for Qt/offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libxcb-cursor0 xvfb
      - name: Install UI extras
        run: |
          python -m pip install -U pip
          pip install -e ".[devui]"
      - name: UI smoke under xvfb
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a pytest -q tests/test_ui_blocked_smoke.py

  devui-macos:
    runs-on: macos-latest
    steps:
      - name: Billing / spending-limit tip
        run: |
          {
            echo "## Runner preflight"
            echo "0s empty-step failures ⇒ raise Actions spending limit (Billing & plans)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI extras
        run: |
          python -m pip install -U pip
          pip install -e ".[devui]"
      - name: Blocked-page smoke (offscreen)
        id: smoke
        run: |
          set -o pipefail
          export QT_QPA_PLATFORM=offscreen
          export QT_DEBUG_PLUGINS=1
          mkdir -p qt-diag
          python -V | tee qt-diag/python.txt
          echo "QT_DEBUG_PLUGINS=$QT_DEBUG_PLUGINS" | tee qt-diag/qt-env.txt
          python -c "import os; from PySide6.QtCore import QLibraryInfo; print('QT_QPA_PLATFORM=', os.environ.get('QT_QPA_PLATFORM')); print('PluginsPath=', QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath))" | tee qt-diag/qt-plugins.txt || true
          python - <<'PY' | tee qt-diag/qt-plugin-dirs.txt || true
          from pathlib import Path
          from PySide6.QtCore import QLibraryInfo
          root = Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath))
          print("plugins_root=", root)
          if root.is_dir():
              for p in sorted(root.rglob("*")):
                  if p.is_dir():
                      print(p.relative_to(root))
          PY
          pytest -q tests/test_ui_blocked_smoke.py 2>&1 | tee qt-diag/devui-macos.log
          # Compress Qt plugin listing + smoke log for the dedicated failure artifact.
          tar -czf qt-plugin-dirs.tgz -C qt-diag qt-plugin-dirs.txt qt-plugins.txt devui-macos.log 2>/dev/null || true
          cp -f qt-plugin-dirs.tgz qt-diag/ 2>/dev/null || true
      - name: Upload Qt diagnostic artifact on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qt-diag-macos
          path: qt-diag/
          if-no-files-found: warn
          retention-days: 3
      - name: Upload Qt plugin dirs tarball on smoke failure
        # always() relative to job end is unnecessary; failure() covers smoke step failure.
        # Bundle includes qt-plugin-dirs.txt + qt-plugins.txt + devui-macos.log.
        # continue-on-error: org artifact quota must not fail the job.
        # See docs/CI_ARTIFACTS.md for quota behavior.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qt-plugin-dirs-macos
          path: |
            qt-plugin-dirs.tgz
            qt-diag/devui-macos.log
          if-no-files-found: warn
          retention-days: 3

  dwm-hdr-poc:
    # continue-on-error is explicitly false: missing Kits may skip compile, but a failed
    # compile when Kits/compilers ARE present must fail the job (see status=ok gate below).
    # Note: hashFiles() is step-scoped only — gate via a checkout + presence check.
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - name: Billing / spending-limit tip
        shell: bash
        run: |
          {
            echo "## Runner preflight"
            echo "If this Windows job never starts (empty steps / ~3s fail), raise the"
            echo "Actions spending limit — \`dwm-hdr-poc\` artifact cannot upload otherwise."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Detect HLSL PoC sources
        id: hlsl
        shell: bash
        run: |
          if [[ -f buusdo/core/dwm_hdr_shaders/sdr_to_hdr_tonemap.hlsl ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "HLSL stub absent; skipping dwm-hdr compile job body"
          fi
      - uses: actions/setup-python@v5
        if: steps.hlsl.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.hlsl.outputs.present == 'true'
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Offline fxc/dxc compile + sha256
        if: steps.hlsl.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          python scripts/compile_dwm_hdr_poc.py --out dist/dwm_hdr_poc
          set -e
          test -f dist/dwm_hdr_poc/manifest.json
          python - <<'PY'
          import json, hashlib, pathlib, shutil, sys
          root = pathlib.Path("dist/dwm_hdr_poc")
          man = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          cso = root / "sdr_to_hdr_tonemap.cso"
          has_compiler = bool(shutil.which("dxc") or shutil.which("dxc.exe") or shutil.which("fxc") or shutil.which("fxc.exe"))
          kits = pathlib.Path(r"C:\Program Files (x86)\Windows Kits\10\bin")
          if not has_compiler and kits.is_dir():
              has_compiler = any((p / "x64" / name).is_file() for p in kits.iterdir() if p.is_dir() for name in ("dxc.exe", "fxc.exe"))
          if man.get("status") == "compile_failed":
              # Still require hlsl_sources.zip for triage when fxc/dxc fails.
              assert (root / "hlsl_sources.zip").is_file(), "hlsl_sources.zip missing after compile_failed"
              print("compile_failed; hlsl_sources.zip present for comparison")
              sys.exit(1)
          if has_compiler:
              # Windows Kits present: require a successful compile (status=ok).
              assert man.get("status") == "ok", man
              assert cso.is_file(), "cso missing after ok compile"
              digest = hashlib.sha256(cso.read_bytes()).hexdigest()
              assert man.get("sha256") == digest, (man.get("sha256"), digest)
              print("sha256 ok", digest)
          elif man.get("status") == "skipped_no_compiler":
              print("compiler missing on runner; HLSL materialize-only accepted")
              assert (root / "hlsl_sources.zip").is_file(), "hlsl_sources.zip missing"
              assert isinstance(man.get("hlsl_sha256"), list) and man["hlsl_sha256"], man
              print("hlsl_sha256", man["hlsl_sha256"])
          elif man.get("status") == "ok":
              digest = hashlib.sha256(cso.read_bytes()).hexdigest()
              assert man.get("sha256") == digest
              assert isinstance(man.get("hlsl_sha256"), list)
              print("sha256 ok", digest)
          else:
              print(man)
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.hlsl.outputs.present == 'true'
        continue-on-error: true
        with:
          name: dwm-hdr-poc
          path: dist/dwm_hdr_poc/
          if-no-files-found: warn
          retention-days: 3
      - name: Upload HLSL sources zip when present
        if: always() && steps.hlsl.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dwm-hdr-hlsl-sources
          path: |
            dist/dwm_hdr_poc/hlsl_sources/
            dist/dwm_hdr_poc/hlsl_sources.zip
          if-no-files-found: ignore
          retention-days: 3
